name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish successful CI build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify repository structure
        shell: pwsh
        run: ./scripts/verify-structure.ps1

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/Localization/Localization.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Project version '$version' is not valid for an automatic release tag."
          }

          $tag = "v$version"
          $notesFile = "release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes file '$notesFile' is missing."
          }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesFile -Raw))) {
            throw "Release notes file '$notesFile' is empty."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Check release tag state
        id: release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if existing_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"               --jq '.object.sha' 2>/dev/null
          )"; then
            if [[ "$existing_sha" == "$RELEASE_SHA" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "create=false" >> "$GITHUB_OUTPUT"
              echo "Release tag $RELEASE_TAG already points at this CI commit."
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "create=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Release tag $RELEASE_TAG already points at $existing_sha. Version $RELEASE_TAG is already published; bump the project version for a new release."
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $RELEASE_TAG will be created at $RELEASE_SHA."
          fi

      - name: Download successful CI artifact
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download '${{ github.event.workflow_run.id }}'             --name 'Localization-v${{ steps.metadata.outputs.version }}'             --dir dist

      - name: Verify downloaded CI artifacts
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/Localization.dll
          test -f 'dist/Localization-v${{ steps.metadata.outputs.version }}.zip'
          test -f dist/SHA256SUMS.txt
          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          version = '${{ steps.metadata.outputs.version }}'
          archive = Path('dist') / f'Localization-v{version}.zip'
          expected = sorted([
              'BepInEx/plugins/Localization/Localization.dll',
              'BepInEx/plugins/Localization/zh-Hant.json',
          ])
          with zipfile.ZipFile(archive) as zf:
              actual = sorted(name for name in zf.namelist() if not name.endswith('/'))
          if actual != expected:
              raise SystemExit(f'Unexpected ZIP contents: {actual!r}')
          print('Release ZIP contents verified.')
          PY

      - name: Create release tag
        if: >
          steps.release_tag.outputs.publish == 'true' &&
          steps.release_tag.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"             -f ref="refs/tags/$RELEASE_TAG"             -f sha="$RELEASE_SHA" >/dev/null

          created_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"               --jq '.object.sha'
          )"
          if [[ "$created_sha" != "$RELEASE_SHA" ]]; then
            echo "Created tag $RELEASE_TAG points at $created_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
        run: |
          set -euo pipefail
          assets=(
            'dist/Localization-v${{ steps.metadata.outputs.version }}.zip'
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}"               --verify-tag               --notes-file "$RELEASE_NOTES_FILE"               --title "Localization $RELEASE_TAG"
          fi
